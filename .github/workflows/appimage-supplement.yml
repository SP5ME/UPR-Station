name: Add AppImage to pre-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing private pre-release tag (assets are never replaced)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: appimage-${{ inputs.tag }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag }}
jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check existing private pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v[0-9][A-Za-z0-9._-]{0,99}",os.environ["RELEASE_TAG"])'
          test "$(gh repo view "$GH_REPO" --json visibility --jq .visibility)" = PRIVATE
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft,isPrerelease,assets > /tmp/upr-release.json
          python3 - <<'PY'
          import json,os
          release=json.load(open('/tmp/upr-release.json'))
          assert release['isPrerelease'] and not release['isDraft']
          names={asset['name'] for asset in release['assets']}
          assert f'UPR-Terminal-{os.environ["RELEASE_TAG"]}-linux-x86_64.AppImage' not in names
          assert 'SHA256SUMS-AppImage.txt' not in names
          PY
      # Build the exact published sources, not the moving main branch.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - run: cargo fetch --locked --manifest-path desktop/Cargo.toml
      - run: python3 scripts/desktop-licenses.py
      - run: python3 -c "from pathlib import Path; assert not Path('desktop/target/legal/MISSING-LICENSE-TEXTS.txt').exists()"
      - name: Build AppImage
        working-directory: desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm exec --yes --package=@tauri-apps/cli@2.11.5 -- tauri build --bundles appimage -- --locked
      - name: Verify and collect AppImage
        run: |
          mkdir -p target/appimage-supplement
          files=(desktop/target/release/bundle/appimage/*.AppImage)
          test "${#files[@]}" = 1 && test -f "${files[0]}"
          asset="UPR-Terminal-$RELEASE_TAG-linux-x86_64.AppImage"
          cp "${files[0]}" "target/appimage-supplement/$asset"
          chmod +x "target/appimage-supplement/$asset"
          mkdir -p target/appimage-smoke
          cd target/appimage-smoke
          "../appimage-supplement/$asset" --appimage-extract >/dev/null
          ./squashfs-root/AppRun --help
          cd ../appimage-supplement
          sha256sum "$asset" > SHA256SUMS-AppImage.txt
      - name: Append assets without replacing existing packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" target/appimage-supplement/*
          gh release view "$RELEASE_TAG" --json body --jq .body > target/appimage-notes.md
          printf '\n\nLinux desktop: dodano AppImage x86-64 z tych samych źródeł co pozostałe paczki. Suma: SHA256SUMS-AppImage.txt. Uruchomienie: chmod +x PLIK.AppImage, następnie ./PLIK.AppImage. AppImage zbudowano na Ubuntu 22.04; zgodność ze starszym glibc nie jest gwarantowana.\n' >> target/appimage-notes.md
          gh release edit "$RELEASE_TAG" --notes-file target/appimage-notes.md

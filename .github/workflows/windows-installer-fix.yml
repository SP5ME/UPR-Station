name: Publish tested Windows installer fix
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing private pre-release to receive the fix1 installer
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: windows-installer-fix-${{ inputs.tag }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag }}
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check private pre-release and absent fix assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python -c 'import os,re; assert re.fullmatch(r"v[0-9][A-Za-z0-9._-]{0,99}",os.environ["RELEASE_TAG"])'
          test "$(gh repo view "$GH_REPO" --json visibility --jq .visibility)" = PRIVATE
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets > release-state.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('release-state.json').read_text(encoding='utf-8'))
          assert r['isPrerelease'] and not r['isDraft']
          names={a['name'] for a in r['assets']}
          assert not names.intersection({f'UPR-Terminal-{os.environ["RELEASE_TAG"]}-windows-x86_64-fix1-setup.exe','SHA256SUMS-Windows-fix1.txt','WINDOWS-INSTALLER-fix1.txt'})
          Path('release-state.json').unlink()
          PY
      - run: rustup update stable --no-self-update
      - run: python tests/installer-hooks.py
      - run: cargo fetch --locked --manifest-path desktop/Cargo.toml
      - run: python scripts/desktop-licenses.py
      - run: python -c "from pathlib import Path; assert not Path('desktop/target/legal/MISSING-LICENSE-TEXTS.txt').exists()"
      - name: Build corrected installer
        working-directory: desktop
        run: npm exec --yes --package=@tauri-apps/cli@2.11.5 -- tauri build --bundles nsis --no-sign -- --locked
      - name: Test fresh install, custom path, migration and repeat install
        shell: pwsh
        run: |
          $installer=Get-ChildItem desktop/target/release/bundle/nsis/*-setup.exe
          if(@($installer).Count -ne 1){throw 'Expected one installer'}
          ./tests/windows-installer.ps1 -Installer $installer.FullName
      - name: Collect separately identified fix and checksum
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,os,shutil
          from pathlib import Path
          out=Path('target/windows-fix1');out.mkdir(parents=True)
          files=list(Path('desktop/target/release/bundle/nsis').glob('*-setup.exe'))
          assert len(files)==1
          name=f'UPR-Terminal-{os.environ["RELEASE_TAG"]}-windows-x86_64-fix1-setup.exe'
          shutil.copy2(files[0],out/name)
          notes='UPR Terminal Windows installer fix1\nApplication version: 0.1.3-prealpha.1\nSource commit: '+os.environ['GITHUB_SHA']+'\nFix: synchronize NSIS OUTDIR after selecting legacy INSTDIR.\nTests: fresh install, custom path, legacy migration, repeat install, shortcuts, resources and preserved operator configuration.\nExisting release assets were not replaced.\n'
          (out/'WINDOWS-INSTALLER-fix1.txt').write_text(notes,encoding='utf-8',newline='\n')
          (out/'SHA256SUMS-Windows-fix1.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir())),encoding='utf-8',newline='\n')
          PY
      - name: Append tested fix without replacing existing files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh repo view "$GH_REPO" --json visibility --jq .visibility)" = PRIVATE
          gh release upload "$RELEASE_TAG" target/windows-fix1/*
          gh release view "$RELEASE_TAG" --json body > target/previous-notes.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          previous=json.loads(Path('target/previous-notes.json').read_text(encoding='utf-8'))['body']
          asset=f'UPR-Terminal-{os.environ["RELEASE_TAG"]}-windows-x86_64-fix1-setup.exe'
          warning='## Windows: pobierz poprawiony instalator fix1\n\nUżyj **'+asset+'** (suma: SHA256SUMS-Windows-fix1.txt). Pierwotny instalator Windows ma błąd migracji katalogu po zmianie nazwy UltimatePR Station → UPR Terminal; nie używaj go do aktualizacji. Stary plik pozostawiono wyłącznie dla identyfikacji. Paczki Linux, Alpine i Docker pozostają niezmienione.\n\n'
          Path('target/windows-fix1-notes.md').write_text(warning+previous,encoding='utf-8',newline='\n')
          PY
          gh release edit "$RELEASE_TAG" --notes-file target/windows-fix1-notes.md

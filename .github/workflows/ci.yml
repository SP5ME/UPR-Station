name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - run: python scripts/verify-publication.py
      - run: cargo +stable test --locked --tests
      - run: cargo +stable build --locked --bin ultimatepr-station
      - name: Browser helper tests
        shell: bash
        run: |
          node --check web/app.js
          node tests/browser/mheard-routes.cjs
          node tests/browser/notification-audio.cjs
          node tests/browser/notification-sounds.cjs
          node tests/browser/product-identity.cjs
          node tests/browser/settings-variants.cjs
          bash tests/installers/server-installer.sh
          bash tests/installers/alpine-update.sh
          UPR_TEST_PYTHON=python bash tests/installers/bootstrap.sh
          python tests/packaging/product-boundary.py
          python tests/packaging/release-download.py
          python tests/packaging/server-package.py
          python tests/packaging/web-update.py
      - name: HTTP and KISS acceptance test
        shell: bash
        run: |
          binary=target/debug/ultimatepr-station
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          python tests/e2e.py "$binary"
# Server project only; no GUI dependencies.

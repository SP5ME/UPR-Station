name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - run: python scripts/verify-publication.py
      - run: cargo +stable test --locked --tests
      - run: cargo +stable build --locked --bin ultimatepr-station
      - name: Browser helper tests
        shell: bash
        run: |
          node --check web/app.js
          node tests/mheard-routes.cjs
          node tests/notification-audio.cjs
          node tests/notification-sounds.cjs
          node tests/product-identity.cjs
          bash tests/server-installer.sh
          python tests/release-download.py
          python tests/server-package.py
      - name: HTTP and KISS acceptance test
        shell: bash
        run: |
          binary=target/debug/ultimatepr-station
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          python tests/e2e.py "$binary"
  desktop:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - run: cargo +stable fetch --locked --manifest-path desktop/Cargo.toml
      - name: Collect license notices
        shell: pwsh
        run: |
          python scripts/desktop-licenses.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path desktop/target/legal/MISSING-LICENSE-TEXTS.txt) { throw 'Missing license texts' }
      - run: cargo +stable test --locked --manifest-path desktop/Cargo.toml
# No releases, deployment, signing secrets or pull_request_target.

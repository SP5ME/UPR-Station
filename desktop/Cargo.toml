[package]
name = "ultimatepr-station-desktop"
version = "0.1.3-prealpha.1"
edition = "2024"
rust-version = "1.88"
description = "UltimatePR Station desktop"
license = "Apache-2.0"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
ultimatepr = { package = "ultimatepr-station", path = ".." }
tauri = { version = "=2.11.6", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
getrandom = "0.3"
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[build-dependencies]
tauri-build = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
